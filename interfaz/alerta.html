<!DOCTYPE html>
<!--
  Pop-up de la alerta de fatiga. Python lo abre en una ventana aparte que queda
  encima de todas las demás aplicaciones. Aceptar o la X lo cierran; después de
  cerrarlo, la alerta vuelve a estar disponible pasada la pausa (10 min por defecto).
  Qué se puede editar aquí: los textos y los colores.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ALERTA — RSI Monitor</title>
    <style>
        :root { color-scheme: light; --rojo: #c0392b; --verde: #239b56; --texto: #1c2c40; --suave: #64748b; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { font: 15px system-ui, "Segoe UI", Arial, sans-serif; color: var(--texto); background: #fff;
               border-top: 8px solid var(--rojo); display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 0; }
        header strong { color: var(--rojo); letter-spacing: .08em; font-size: 16px; }
        .cerrar { border: none; background: none; font-size: 24px; line-height: 1; cursor: pointer; color: var(--suave); padding: 2px 8px; border-radius: 6px; }
        .cerrar:hover { background: #f3f4f6; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 22px; gap: 10px; }
        .icono { font-size: 46px; line-height: 1; color: var(--rojo); }
        h1 { margin: 0; font-size: 22px; color: var(--rojo); }
        #indice { margin: 0; color: var(--suave); }
        footer { padding: 0 22px 16px; text-align: center; }
        .aceptar { min-width: 180px; padding: 11px 22px; font: inherit; font-weight: 700; color: #fff; background: var(--verde); border: none; border-radius: 8px; cursor: pointer; }
        .aceptar:focus-visible, .cerrar:focus-visible { outline: 3px solid #86b8f4; outline-offset: 2px; }
        .aclaracion { margin: 10px 0 0; font-size: 11px; color: var(--suave); }
    </style>
</head>
<body>
<header>
    <strong>ALERTA</strong>
    <button type="button" class="cerrar" id="cerrar" aria-label="Cerrar la alerta">×</button>
</header>
<main role="alertdialog" aria-labelledby="titulo" aria-describedby="aclaracion">
    <div class="icono" aria-hidden="true">⚠</div>
    <h1 id="titulo">Riesgo de fatiga muscular: se sugiere tomar un descanso</h1>
    <p id="indice"></p>
</main>
<footer>
    <button type="button" class="aceptar" id="aceptar" autofocus>Aceptar</button>
    <p class="aclaracion" id="aclaracion">Este mensaje no es un diagnóstico médico. El índice de fatiga no está validado.</p>
</footer>
<script>
    "use strict";
    const cerrar = () => window.pywebview && window.pywebview.api.cerrar_alerta();
    document.getElementById("aceptar").addEventListener("click", cerrar);
    document.getElementById("cerrar").addEventListener("click", cerrar);

    async function mostrarDatos() {
        const datos = await window.pywebview.api.datos_alerta();
        if (typeof datos.indice === "number") {
            document.getElementById("indice").textContent =
                `Índice de fatiga: ${datos.indice.toFixed(1).replace(".", ",")} % (alerta desde ${datos.umbral} %).`;
        }
    }
    window.addEventListener("pywebviewready", mostrarDatos);
    if (window.pywebview && window.pywebview.api) mostrarDatos();
</script>
</body>
</html>
